<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kuis Interaktif</title>
  <!-- Menggunakan Tailwind CSS CDN untuk tampilan modern & responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 w-full max-max-w-xl p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700">
    
    <!-- Halaman Utama / Tampilan Kuis -->
    <div id="quiz-container">
      <!-- Header / Progress -->
      <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
        <h1 class="text-xl font-bold text-indigo-400">Kuis Pengetahuan Umum</h1>
        <span id="question-number" class="text-sm font-semibold bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full">
          Soal 1/5
        </span>
      </div>

      <!-- Pertanyaan -->
      <h2 id="question-text" class="text-lg sm:text-xl font-medium mb-6 leading-relaxed">
        Memuat pertanyaan...
      </h2>

      <!-- Pilihan Jawaban -->
      <div id="answer-buttons" class="space-y-3 mb-6">
        <!-- Tombol akan di-generate via JavaScript -->
      </div>

      <!-- Tombol Lanjut -->
      <button id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 hidden">
        Pertanyaan Selanjutnya →
      </button>
    </div>

    <!-- Halaman Hasil Akhir (Tersembunyi Awalnya) -->
    <div id="result-container" class="hidden text-center py-6">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold mb-2">Kuis Selesai!</h2>
      <p class="text-slate-400 mb-6">Berikut adalah hasil skor Anda:</p>
      
      <div class="bg-slate-900/50 rounded-xl p-6 mb-6 border border-slate-700 inline-block w-full">
        <span id="final-score" class="text-5xl font-extrabold text-indigo-400">0</span>
        <span id="total-questions" class="text-2xl text-slate-500 font-bold">/ 5</span>
      </div>

      <button id="restart-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200">
        Ulangi Kuis
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
